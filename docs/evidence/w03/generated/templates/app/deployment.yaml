---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "app-deployment"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "app"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Chart.Name }}"
        app.kubernetes.io/component: "app"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
    spec:
      nodeSelector:
        agentpool: "system"
      containers:
        - image: "{{ .Values.parameters.app.app_image }}"
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            httpGet:
              scheme: "HTTP"
              path: "/health/live"
              port: 8080
          name: "app"
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            httpGet:
              scheme: "HTTP"
              path: "/health/ready"
              port: 8080
          envFrom:
            - configMapRef:
                name: "app-config"
            - secretRef:
                name: "app-secrets"
          ports:
            - name: "http"
              protocol: "TCP"
              containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
            requests:
              cpu: "50m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
          volumeMounts:
            - name: "workspace"
              mountPath: "/workspace"
          imagePullPolicy: "IfNotPresent"
      initContainers:
        - command:
            - "sh"
          image: "mcr.microsoft.com/azurelinux/base/core:3.0"
          name: "fixture-init"
          args:
            - "-c"
            - "mkdir -p /workspace/fixture && printf '# Remediation fixture\\n' > /workspace/fixture/README.md"
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
          volumeMounts:
            - name: "workspace"
              mountPath: "/workspace"
          imagePullPolicy: "IfNotPresent"
      volumes:
        - name: "workspace"
          emptyDir:
            sizeLimit: "2Gi"
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Chart.Name }}"
      app.kubernetes.io/component: "app"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: "RollingUpdate"
