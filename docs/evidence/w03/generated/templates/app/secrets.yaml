---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "app-secrets"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "app"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  COPILOT_TOKEN: "{{ .Values.secrets.app.copilot_token }}"
type: "Opaque"
