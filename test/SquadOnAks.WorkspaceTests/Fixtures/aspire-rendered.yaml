---
# Source: apphost/templates/api/deployment.yaml
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "api-deployment"
  labels:
    app.kubernetes.io/name: "apphost"
    app.kubernetes.io/component: "api"
    app.kubernetes.io/instance: "app"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "apphost"
        app.kubernetes.io/component: "api"
        app.kubernetes.io/instance: "app"
    spec:
      automountServiceAccountToken: false
      containers:
        - image: "api:latest"
          name: "api"
          readinessProbe:
            periodSeconds: 5
            httpGet:
              path: "/health/ready"
              port: 8080
          envFrom:
            - configMapRef:
                name: "api-config"
            - secretRef:
                name: "api-secrets"
          ports:
            - name: "http"
              protocol: "TCP"
              containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "50m"
              memory: "128Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          imagePullPolicy: "IfNotPresent"
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        runAsGroup: 1654
        runAsUser: 1654
        runAsNonRoot: true
  selector:
    matchLabels:
      app.kubernetes.io/name: "apphost"
      app.kubernetes.io/component: "api"
      app.kubernetes.io/instance: "app"
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: "RollingUpdate"

---
# Source: apphost/templates/db/statefulset.yaml
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "db-statefulset"
  labels:
    app.kubernetes.io/name: "apphost"
    app.kubernetes.io/component: "db"
    app.kubernetes.io/instance: "app"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "apphost"
        app.kubernetes.io/component: "db"
        app.kubernetes.io/instance: "app"
    spec:
      automountServiceAccountToken: false
      containers:
        - image: "docker.io/library/postgres:18.3"
          name: "db"
          envFrom:
            - configMapRef:
                name: "db-config"
            - secretRef:
                name: "db-secrets"
          ports:
            - name: "tcp"
              protocol: "TCP"
              containerPort: 5432
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "50m"
              memory: "128Mi"
          volumeMounts:
            - name: "apphost-feed4158f1-db-data"
              mountPath: "/var/lib/postgresql"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          imagePullPolicy: "IfNotPresent"
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        fsGroup: 999
        runAsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
  selector:
    matchLabels:
      app.kubernetes.io/name: "apphost"
      app.kubernetes.io/component: "db"
      app.kubernetes.io/instance: "app"
  replicas: 1
  volumeClaimTemplates:
    - apiVersion: "v1"
      kind: "PersistentVolumeClaim"
      metadata:
        name: "apphost-feed4158f1-db-data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "1Gi"
  persistentVolumeClaimRetentionPolicy: {}
  updateStrategy:
    rollingUpdate: {}
    type: "RollingUpdate"
